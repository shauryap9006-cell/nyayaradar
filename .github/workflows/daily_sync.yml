name: Daily Judicial Data Ingestion & Sync

on:
  schedule:
    # Runs everyday at 02:00 AM IST (20:30 UTC)
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-sync:
    name: Ingest NJDG & Sync 781 Courts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: ⚙️ Run Daily Data Ingestion Pipeline
        run: |
          python pipeline/update_data.py

      - name: 🛡️ Run Sanity & Quality Verification Audit
        run: |
          python scripts/audit_and_verify.py

      - name: 🚀 Commit & Push Fresh Snapshot
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/seeds/courts.json data/seeds/district_courts.json data/nyayaradar.db
          if git diff --staged --quiet; then
            echo "No changes in data snapshot today."
          else
            git commit -m "chore(data): automated daily judicial ingestion snapshot [skip ci]"
            git push
          fi
